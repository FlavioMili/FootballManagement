# Builds the desktop packages and publishes them on a GitHub Release.
#  - Pushing a tag "v*" (e.g. v1.0.0) publishes release "v1.0.0". The tag's
#    numbers must equal project(VERSION) in CMakeLists.txt, or every build
#    job stops (packaging/release_version.sh).
#  - Running it manually builds the packages as artifacts; with "publish"
#    it also creates a draft release for the given version.
# Release notes are the version's section of CHANGELOG.md
# (packaging/release_notes.sh). See docs/development/release.md.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (e.g. 1.0.0-rc1)
        required: true
        type: string
      publish:
        description: Create a draft GitHub Release tagged v<version> at this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: packages
    if: >-
      !cancelled() && needs.packages.result == 'success' &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Check packages and write checksums
        working-directory: dist
        run: |
          ls -l
          # Every supported platform must have a complete downloadable package.
          compgen -G "*-linux-x86_64.tar.gz" > /dev/null
          compgen -G "*-linux-x86_64.AppImage" > /dev/null
          compgen -G "*-macos-arm64.zip" > /dev/null
          compgen -G "*-windows-x86_64.zip" > /dev/null
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          if [[ $EVENT_NAME == push ]]; then version=$REF_NAME; else version=$INPUT_VERSION; fi
          packaging/release_notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "Check the downloads with \`sha256sum -c SHA256SUMS.txt\`."
            echo
            echo "### Play on Windows"
            echo 'Download the `Player12-*-windows-x86_64.zip` asset, extract the entire ZIP, and double-click `Player12.exe` inside the extracted folder. Keep the assets and licences beside the executable. No build tools or separate VC++ runtime installation are needed by this package.'
            echo
            echo 'On Linux, use the AppImage or extract the tarball and run `bin/Player12`. On macOS, extract the ARM64 ZIP and open `Player12.app`.'
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update the release
        run: |
          if [[ $EVENT_NAME == push ]]; then
            tag=$REF_NAME
            flags=(--verify-tag)
          else
            tag="v${INPUT_VERSION#v}"
            flags=(--draft --target "$GITHUB_SHA")
          fi
          [[ $tag == *-* ]] && flags+=(--prerelease)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Player12 $tag" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
