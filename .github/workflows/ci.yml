name: Website checks
on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check pages, local links, images and media budget
        run: python3 scripts/check_site.py
      - name: Check whitespace
        run: git diff --check
