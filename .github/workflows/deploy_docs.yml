name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'docs/**'
      - 'Doxyfile'
      - '*.md'
      - '.github/workflows/deploy_docs.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: main

      - name: Checkout website branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: website
          path: website

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen Documentation
        run: |
          cd main
          doxygen Doxyfile

      # Only the public pages: contributor notes in the root stay out.
      - name: Copy Markdown files (Cherry pick)
        run: |
          for page in README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            if [[ -f main/$page ]]; then cp "main/$page" website/; fi
          done
          mkdir -p website/docs
          cp main/docs/ARCHITECTURE.md website/docs/ || true

      - name: Copy Doxygen Output to Website
        run: |
          # Clean old api docs and copy new ones
          rm -rf website/api
          cp -r main/docs/html website/api

      - name: Commit and Push to website
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: auto-deploy doxygen api and sync markdown files" || echo "No changes to commit"
          git push origin website
