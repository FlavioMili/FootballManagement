name: macOS runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Install LLVM
        run: brew install llvm@20 ninja
      - name: Check static runtime startup
        run: |
          mkdir probe
          cat > probe/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.29)
          project(RuntimeProbe LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_SCAN_FOR_MODULES OFF)
          include(FetchContent)
          FetchContent_Declare(googletest URL https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz)
          FetchContent_MakeAvailable(googletest)
          add_executable(probe main.cpp)
          target_link_libraries(probe PRIVATE GTest::gtest_main "-framework Cocoa")
          CMAKE
          cat > probe/main.cpp <<'CPP'
          #include <gtest/gtest.h>
          #include <thread>
          TEST(Runtime, Starts) { std::jthread worker([] {}); EXPECT_TRUE(true); }
          CPP
          llvm=$(brew --prefix llvm@20)
          cmake -S probe -B probe/build -G Ninja \
            -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" \
            "-DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ $llvm/lib/c++/libc++.a $llvm/lib/c++/libc++abi.a"
          cmake --build probe/build --parallel 3
          otool -L probe/build/probe
          probe/build/probe --gtest_list_tests || \
            lldb --batch -o run -o 'thread backtrace all' -- probe/build/probe --gtest_list_tests
